# One-VPS production Compose for Dokploy.
# Dokploy manages this file: clone, build, env injection, Traefik routing.
# Redis is not part of the v0 stack. Add it intentionally if Medusa requires it later.

services:
  postgres:
    image: postgres:16-alpine
    container_name: sunluk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medusa}
      POSTGRES_USER: ${POSTGRES_USER:-medusa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medusa} -d ${POSTGRES_DB:-medusa}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      dokploy-network:
        aliases:
          - sunluk-postgres

networks:
  dokploy-network:
    external: true

volumes:
  postgres_data:
