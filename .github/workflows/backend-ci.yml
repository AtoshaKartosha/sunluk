name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

jobs:
  backend-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Backend lint
        run: npm run lint --prefix backend

      - name: Backend test
        run: |
          # Only run tests if any test files exist; otherwise skip gracefully.
          if find backend -path '*/node_modules' -prune -o \( -name '*.test.ts' -o -name '*.test.js' -o -name '*.spec.ts' -o -name '*.spec.js' \) -print | grep -q .; then
            npm run test --prefix backend
          else
            echo "No test files found — skipping."
          fi

      - name: Backend build
        run: npm run build --prefix backend

      - name: Deploy to Dokploy (Push to main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOKPLOY_BACKEND_WEBHOOK: ${{ secrets.DOKPLOY_BACKEND_WEBHOOK }}
        run: |
          if [ -z "$DOKPLOY_BACKEND_WEBHOOK" ]; then
            echo "Error: DOKPLOY_BACKEND_WEBHOOK secret is missing."
            exit 1
          fi
          curl -f -L -s -S "$DOKPLOY_BACKEND_WEBHOOK" && echo "Webhook triggered successfully."
