name: Storefront CI

on:
  pull_request:
    paths:
      - 'storefront/**'
      - '.github/workflows/storefront-ci.yml'
  push:
    branches: [main]
    paths:
      - 'storefront/**'
      - '.github/workflows/storefront-ci.yml'

permissions:
  contents: read

jobs:
  storefront-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: storefront/package-lock.json

      - name: Install storefront dependencies
        run: npm ci --prefix storefront

      - name: Storefront lint
        run: npm run lint --prefix storefront

      - name: Storefront test
        run: npm run test --prefix storefront

      - name: Storefront build
        run: npm run build --prefix storefront
        env:
          NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://localhost:9000
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: pk_ci_placeholder
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      - name: Deploy to Dokploy (Push to main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOKPLOY_STOREFRONT_WEBHOOK: ${{ secrets.DOKPLOY_STOREFRONT_WEBHOOK }}
        run: |
          if [ -z "$DOKPLOY_STOREFRONT_WEBHOOK" ]; then
            echo "Error: DOKPLOY_STOREFRONT_WEBHOOK secret is missing."
            exit 1
          fi
          curl -X POST -H "Content-Type: application/json" -H "x-github-event: push" -d "{\"ref\":\"refs/heads/main\",\"head_commit\":{\"id\":\"$GITHUB_SHA\"},\"commits\":[{\"modified\":[\"storefront/package.json\"]}]}" -f -L -s -S "$DOKPLOY_STOREFRONT_WEBHOOK" && echo "Webhook triggered successfully."
